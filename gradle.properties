# Sets default memory used for gradle commands. Required to give the Minecraft
# decompilation process enough room.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# gradle kotlin jvm plugin breaks without this
kotlin.stdlib.default.dependency=false

# ---------------------------------------------------------------------------
# Mod identity
# ---------------------------------------------------------------------------
mod_id=hexisle
mod_name=hexisle
mod_version=0.1.0
maven_group=moe.vcup.hexisle
archives_base_name=hexisle

# ---------------------------------------------------------------------------
# Minecraft / mappings
#
# Yarn is deliberately kept: Fabric, Quilt and NeoForge all read Yarn names in
# source and Architectury Loom remaps them per platform. Official (Mojang)
# mappings are what Forge/NeoForge run on, so Loom produces both namespaces.
# ---------------------------------------------------------------------------
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
quilt_mappings=1.20.1+build.23

# ---------------------------------------------------------------------------
# Toolchain versions
# ---------------------------------------------------------------------------
# Architectury Loom. `ModPlatform` in this version enumerates FABRIC, FORGE,
# QUILT and NEOFORGE, which is exactly the loader set this project targets.
architectury_loom_version=1.9.425
architectury_plugin_version=3.4.164
# Vanilla-only Minecraft for the shared `common` module.
vanilla_gradle_version=0.2.1-SNAPSHOT
asm_version=9.4
shadow_version=7.1.2

# ---------------------------------------------------------------------------
# Loaders
# ---------------------------------------------------------------------------
loader_version=0.16.14

# Quilt
quilt_loader_version=0.19.2
qfapi_version=7.7.0+0.92.2-1.20.1

# Forge (legacy net.minecraftforge)
forge_version=47.1.47
# NeoForge for 1.20.1 is published as net.neoforged:forge and keeps the
# net.minecraftforge.* packages and the "forge" mod id.
neoforge_version=1.20.1-47.1.106

# ---------------------------------------------------------------------------
# Dependencies -- Fabric
# ---------------------------------------------------------------------------
fabric_version=0.92.6+1.20.1

# ---------------------------------------------------------------------------
# Dependencies -- common (the Hex Casting stack every platform links against)
# ---------------------------------------------------------------------------
hexcasting_version=0.11.4
# paucal's Forge artifact only exists as -pre-118 on maven.blamejared.com
paucal_version=0.6.0-pre-118
patchouli_version=84.1
clothconfig_version=11.1.136
inline_version=1.20.1-1.2.2-12
emi_version=1.1.22+1.20.1
emi_forge_version=1.1.22+1.20.1+forge
trinkets_version=3.7.2
cca_version=5.2.3
curios_version=5.14.1+1.20.1

# MixinExtras is bundled by Fabric/Quilt Loader, but neither Forge nor
# NeoForge 1.20.1 ships it, so the Forge-like jars embed it via Jar-in-Jar.
mixin_extras_version=0.4.1
