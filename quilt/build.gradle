// Quilt platform module (Architectury Loom).
//
// `loom.platform=quilt` selects Architectury Loom's Quilt platform. Loom reads
// the `quilt_installer.json` embedded in quilt-loader to set up the launch and
// remap chain, which is why quilt-loader is a direct dependency here.

plugins {
    id 'dev.architectury.loom'
}

base {
    archivesName = "${archives_base_name}-quilt"
}

loom {
    mixin {
        defaultRefmapName = "${mod_id}.quilt.refmap.json"
    }

    runs {
        client {
            client()
            setConfigName('Quilt Client')
            runDir 'run'
        }
        server {
            server()
            setConfigName('Quilt Server')
            runDir 'run-server'
        }
        configureEach {
            ideConfigGenerated(true)
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    // Quilt Loader carries quilt_installer.json, required by Loom for this platform.
    modImplementation "org.quiltmc:quilt-loader:${project.quilt_loader_version}"
    // Quilted Fabric API: Quilt's packaging of the Fabric API modules, so the
    // same api/ calls the Fabric module makes resolve here too.
    modImplementation "org.quiltmc.quilted-fabric-api:quilted-fabric-api:${project.qfapi_version}"

    // ---------------------------------------------------------------------
    // Hex Casting and its Fabric-family stack. Quilt runs Fabric mods, so on
    // Quilt the addon links against the Fabric artifact.
    // ---------------------------------------------------------------------
    modImplementation("at.petra-k.hexcasting:hexcasting-fabric-${project.minecraft_version}:${project.hexcasting_version}") {
        exclude module: 'phosphor'
        exclude module: 'lithium'
    }
    modImplementation "vazkii.patchouli:Patchouli:${project.minecraft_version}-${project.patchouli_version}-FABRIC"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}"

    modRuntimeOnly "at.petra-k:paucal:0.6.1-pre-7+1.20.1-fabric"

    modImplementation(include("io.github.llamalad7:mixinextras-fabric:${project.mixin_extras_version}"))
}

// Quilted Fabric API *is* Fabric API for Quilt: it republishes every
// `net.fabricmc.fabric` class under the `org.quiltmc.quilted-fabric-api` group.
// Any plain `net.fabricmc.fabric-api` module therefore collides with it -- and
// on a clean build Loom reports ~940 duplicate classes while remapping.
//
// Excluding the group on a single dependency is not enough: Hex Casting,
// Patchouli and Cloth Config each declare their own `fabric-api` dependency, so
// the exclusion has to cover every configuration on this project. QFAPI is a
// different group and is unaffected.
configurations.configureEach {
    exclude group: 'net.fabricmc.fabric-api'
}
